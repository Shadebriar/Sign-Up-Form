<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class = "sidebar">
    <div class = "logo-container">
        <img src = "images/odin.png" alt = "odin logo">
        <h1>ODIN</h1>
    </div>
    <p class="photo-credit">Photo by <a href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA">Halie West</a> on <a href="https://unsplash.com">Unsplash</a></p>
</div>

<div class = "main-content">
    <div class = "header">
        <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams.</p>
        <p>Sign up now to get started.</p>

        <p>You <em>know</em> you want to.</p>
    </div>

        <p>Let's do this!</p>
    <form action="example.com/path" method="post">
       
       <div class = "form_group1">
            <label for="first_name">First Name:</label>
            <input type="text" id="first_name">
        </div>

        <div class = "form_group2">
            <label for="last_name">Last Name:</label>
            <input type="text" id="last_name">
        </div>

        <div class = "form_group3">
            <label for="email">Email:</label>
            <input type="email" id="email">
        </div>

        <div class = "form_group4">
            <label for="phone_number">Phone Number:</label>
            <input type="tel" id="phone_number">
        </div>

        <div class = "form_group5">
            <label for="password">Password:</label>
            <input type="password" id="password">
        </div>

        <div class = "form_group6">
            <label for="confirm_password">Confirm Password:</label>
            <input type="password" id="confirm_password">
        </div>
    </form>

    <div class="form-footer">
        <button type="submit">Create Account</button>
        <p>Already have an account? <a href="#">Log in</a></p>
    </div>

</div>
</body>
</html>
